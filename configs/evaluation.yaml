evaluation:
  validation_language: source   # source | target : which validation split is used during training
  validation_size_per_language: 1000   # used when validation_language=source; null => full split
  test_language_mode: all_targets   # all_targets | train : evaluate on every configured target
                                    # or only on the language(s) the run trained on
  # Also evaluate each target-language validation split. This provides the
  # target-validation metrics used for EXP-3 checkpoint selection, which must
  # never use target test data.
  eval_target_validation: true

  metrics: [entity_precision, entity_recall, entity_f1, per_type_f1]

  bootstrap:
    n_resamples: 1000
    seed: 42
    confidence_level: 0.95

  export:
    sentence_level: true
    entity_level: true
